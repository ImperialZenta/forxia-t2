services:
  # Daily development — hot reload, code mounted from your machine
  web-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    restart: unless-stopped

  # Production-like test — same build Vercel will run
  web:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:8000
    restart: unless-stopped

volumes:
  node_modules:
